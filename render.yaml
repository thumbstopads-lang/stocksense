# Render Blueprint for StockSense (free tier).
# Deploy via Render Dashboard → New → Blueprint → paste the GitHub repo URL.
# Then set DATABASE_URL (from Neon) and JWT_SECRET as environment variables.
services:
  - type: web
    name: stocksense
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # paste the Neon Postgres connection string in the dashboard
      - key: JWT_SECRET
        generateValue: true # Render generates a random secret on first deploy
